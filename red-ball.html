<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغامرة الكرة الحمراء</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #f1f7ff;
      background: #081322;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at 50% 0%, #1b4262 0, transparent 55%), #081322;
    }

    main {
      width: min(100%, 960px);
      padding: 20px;
      border: 1px solid #2b4660;
      border-radius: 22px;
      background: linear-gradient(150deg, #142940, #0c1b2d);
      box-shadow: 0 24px 70px #0008;
    }

    header, .stats, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header { margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.8rem); }
    .hint { margin: 5px 0 0; color: #a8bdd2; font-size: 0.9rem; }
    .stats { justify-content: flex-end; }

    .stat {
      min-width: 76px;
      padding: 7px 11px;
      border: 1px solid #2d4965;
      border-radius: 12px;
      background: #0b1929;
      text-align: center;
    }

    .stat span { display: block; color: #9eb4ca; font-size: 0.72rem; }
    .stat strong { display: block; margin-top: 2px; color: #ffd16e; font-size: 1.1rem; }

    .game {
      position: relative;
      overflow: hidden;
      border: 1px solid #31516d;
      border-radius: 15px;
      background: #8bd6ed;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 500;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #081626bd;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .overlay[hidden] { display: none; }
    .card { max-width: 420px; }
    .card h2 { margin: 0 0 8px; font-size: 1.8rem; }
    .card p { margin: 0 0 17px; color: #d1deeb; line-height: 1.7; }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 11px;
      color: #271500;
      background: #ffd16e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .actions { margin-top: 12px; }
    .actions button { color: #e5f0fb; background: #203a55; }
    .small-hint { margin: 11px 0 0; color: #9eb4ca; font-size: 0.82rem; text-align: center; }

    @media (max-width: 560px) {
      main { padding: 13px; }
      header { align-items: flex-start; flex-direction: column; }
      .stats { justify-content: flex-start; }
      .hint { max-width: 34ch; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>مغامرة الكرة الحمراء</h1>
        <p class="hint">عشر مراحل جديدة، بعوائق متحركة ورسوم أوضح. اقفز واجمع النجوم!</p>
      </div>
      <div class="stats" aria-label="نتيجة اللعبة">
        <div class="stat"><span>المرحلة</span><strong id="level">1 / 10</strong></div>
        <div class="stat"><span>النجوم</span><strong id="stars">0 / 5</strong></div>
        <div class="stat"><span>المحاولات المتبقية</span><strong id="tries">3 / 3</strong></div>
      </div>
    </header>

    <section class="game" aria-label="لعبة الكرة الحمراء">
      <canvas id="canvas" width="900" height="500" aria-label="ساحة اللعب"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="title">مستعد للمغامرة؟</h2>
          <p id="message">لديك 3 محاولات فقط. استخدم ← و → للحركة و↑ أو مسافة للقفز، وتجنب الأشواك والأعداء المتحركين!</p>
          <button id="start" type="button">ابدأ اللعب</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="restart" type="button">إعادة المرحلة</button>
    </div>
    <p class="small-hint">يمكنك أيضًا استخدام A و D للحركة، و W للقفز.</p>
  </main>

  <script>
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.querySelector("#overlay");
    const titleElement = document.querySelector("#title");
    const messageElement = document.querySelector("#message");
    const startButton = document.querySelector("#start");
    const starsElement = document.querySelector("#stars");
    const triesElement = document.querySelector("#tries");
    const levelElement = document.querySelector("#level");

    const viewWidth = 900;
    const viewHeight = 500;
    const groundY = 420;
    const playerRadius = 20;
    const maxAttempts = 3;
    const gravity = 0.62;
    const maxSpeed = 5.2;
    const acceleration = 0.72;
    const friction = 0.82;
    const basePlatforms = [
      { x: 300, y: 340, width: 150, height: 18 },
      { x: 560, y: 300, width: 145, height: 18 },
      { x: 820, y: 350, width: 180, height: 18 },
      { x: 1110, y: 315, width: 160, height: 18 },
      { x: 1400, y: 350, width: 170, height: 18 },
      { x: 1680, y: 300, width: 180, height: 18 },
      { x: 1980, y: 340, width: 160, height: 18 },
      { x: 2240, y: 310, width: 180, height: 18 }
    ];
    const baseSpikes = [
      { x: 470, width: 75 }, { x: 740, width: 65 },
      { x: 1020, width: 78 }, { x: 1300, width: 70 },
      { x: 1600, width: 65 }, { x: 1880, width: 75 },
      { x: 2160, width: 70 }, { x: 2450, width: 75 }
    ];
    const baseStars = [
      { x: 380, y: 292 }, { x: 635, y: 250 }, { x: 910, y: 300 },
      { x: 1190, y: 265 }, { x: 1485, y: 300 }
    ];
    const palettes = [
      ["#88d7ed", "#e0f4d4", "#4c9c62"],
      ["#8ec5ff", "#f4e2c8", "#54875a"],
      ["#a9d7df", "#f2e6d1", "#4b8d71"],
      ["#f0b7a4", "#f5e6bf", "#648b55"],
      ["#a5c7ff", "#e9e2f4", "#537f61"]
    ];
    const keys = new Set();
    let player;
    let worldWidth = 2600;
    let cameraX = 0;
    let platforms = [];
    let spikes = [];
    let stars;
    let movingHazards = [];
    let levelIndex = 1;
    let attemptsRemaining = maxAttempts;
    let state = "ready";
    let lastFrame = 0;
    let accumulator = 0;
    let jumpQueuedUntil = 0;
    let ballRotation = 0;
    let squash = 1;
    let animationTime = 0;
    let dpr = 1;

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      dpr = Math.min(2.5, window.devicePixelRatio || 1);
      canvas.width = Math.round(bounds.width * dpr);
      canvas.height = Math.round(bounds.width * viewHeight / viewWidth * dpr);
      ctx.setTransform(canvas.width / viewWidth, 0, 0, canvas.height / viewHeight, 0, 0);
      draw();
    }

    function loadLevel() {
      const difficulty = levelIndex - 1;
      worldWidth = 2600 + difficulty * 110;
      const worldScale = worldWidth / 2600;
      platforms = basePlatforms.map((platform, index) => ({
        ...platform,
        x: platform.x * worldScale + difficulty * 4,
        y: Math.max(295, Math.min(365, platform.y + (((index + difficulty) % 3) - 1) * (7 + Math.floor(difficulty / 3) * 2)))
      }));
      spikes = baseSpikes.map((spike, index) => ({
        x: index === baseSpikes.length - 1
          ? worldWidth - 300
          : spike.x * worldScale + difficulty * 4 + (index % 2) * difficulty * 3,
        width: spike.width + 18 + Math.floor(difficulty * 1.5) + (difficulty > 4 && index % 2 === 0 ? 10 : 0)
      }));
      stars = baseStars.map((star, index) => ({
        x: star.x * worldScale + difficulty * 4,
        y: Math.max(225, Math.min(310, star.y + (((index + difficulty) % 3) - 1) * 10)),
        collected: false,
        phase: index * 1.7
      }));
      movingHazards = Array.from({ length: Math.min(2 + Math.floor(difficulty / 2), 6) }, (_, index) => ({
        x: (535 + index * 390) * worldScale + difficulty * 4,
        baseY: 310 + (index % 2) * 35,
        y: 310 + (index % 2) * 35,
        phase: index * 1.9 + difficulty * 0.7,
        speed: 1.7 + difficulty * 0.14,
        range: 42 + difficulty * 2,
        radius: 18 + Math.floor(difficulty / 4)
      }));
      levelElement.textContent = `${levelIndex} / 10`;
    }

    function resetLevel() {
      loadLevel();
      player = { x: 80, y: groundY - playerRadius, vx: 0, vy: 0, onGround: true, coyoteTime: 0 };
      cameraX = 0;
      ballRotation = 0;
      squash = 1;
      starsElement.textContent = `0 / ${stars.length}`;
      draw();
    }

    function startGame() {
      if (state === "next") {
        levelIndex += 1;
        resetLevel();
      } else if (state === "won") {
        levelIndex = 1;
        attemptsRemaining = maxAttempts;
        updateAttempts();
        resetLevel();
      } else if (state === "outOfAttempts") {
        levelIndex = 1;
        attemptsRemaining = maxAttempts;
        updateAttempts();
        resetLevel();
      } else if (state === "ready") {
        if (!player) resetLevel();
      }
      state = "playing";
      overlay.hidden = true;
      lastFrame = performance.now();
      accumulator = 0;
      requestAnimationFrame(loop);
    }

    function showOverlay(title, message, buttonText) {
      titleElement.textContent = title;
      messageElement.textContent = message;
      startButton.textContent = buttonText;
      overlay.hidden = false;
    }

    function updateAttempts() {
      triesElement.textContent = `${attemptsRemaining} / ${maxAttempts}`;
    }

    function loseLife() {
      attemptsRemaining = Math.max(0, attemptsRemaining - 1);
      updateAttempts();
      keys.clear();
      resetLevel();
      if (attemptsRemaining === 0) {
        levelIndex = 1;
        resetLevel();
        state = "outOfAttempts";
        showOverlay("خلصت محاولاتك يا بطل!", "يبدو أن الأشواك فازت بالجولة! اضغط للعودة إلى المرحلة الأولى وبدء جولة جديدة بثلاث محاولات.", "ابدأ من جديد");
        return;
      }
      state = "ready";
      const taunts = [
        "الكرة طارت أكثر من اللازم! خذ نفسًا وحاول من جديد.",
        "الأشواك أخذت نقطة هذه المرة! باقي لك فرصة، انتبه للقفزة.",
        "كان قريبًا... تقريبًا! حاول توقيت القفزة بشكل أفضل."
      ];
      showOverlay("أوه! راحت محاولة", `${taunts[maxAttempts - attemptsRemaining - 1]} بقيت ${attemptsRemaining} من ${maxAttempts} محاولات. المرحلة ${levelIndex} بانتظارك.`, "حاول مرة أخرى");
    }

    function winGame() {
      if (levelIndex < 10) {
        state = "next";
        showOverlay(`أنهيت المرحلة ${levelIndex}!`, `جمعت ${stars.filter((star) => star.collected).length} من ${stars.length} نجوم. المحاولات المتبقية: ${attemptsRemaining}. استعد للتحدي التالي!`, "المرحلة التالية");
      } else {
        state = "won";
        showOverlay("فزت بكل المراحل!", `رائع! أنهيت المراحل العشر وجمعت ${stars.filter((star) => star.collected).length} من ${stars.length} نجوم في المرحلة الأخيرة.`, "العب من جديد");
      }
    }

    function update(step) {
      animationTime += step / 60;
      movingHazards.forEach((hazard) => {
        hazard.y = hazard.baseY + Math.sin(animationTime * hazard.speed + hazard.phase) * hazard.range;
      });
      const left = keys.has("ArrowLeft") || keys.has("a") || keys.has("A");
      const right = keys.has("ArrowRight") || keys.has("d") || keys.has("D");
      const jump = keys.has("ArrowUp") || keys.has("w") || keys.has("W") || keys.has(" ");

      if (left !== right) player.vx += (left ? -acceleration : acceleration) * step;
      else player.vx *= Math.pow(friction, step);
      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));

      if (player.onGround) player.coyoteTime = 0.11;
      else player.coyoteTime = Math.max(0, player.coyoteTime - step / 60);

      if (jumpQueuedUntil > performance.now() && player.coyoteTime > 0) {
        player.vy = -12.8;
        player.onGround = false;
        player.coyoteTime = 0;
        jumpQueuedUntil = 0;
      }

      const previousBottom = player.y + playerRadius;
      player.x += player.vx * step;
      player.x = Math.max(playerRadius, Math.min(worldWidth - playerRadius, player.x));
      player.vy += gravity * step;
      if (!jump && player.vy < -4) player.vy *= Math.pow(0.94, step);
      player.y += player.vy * step;
      player.onGround = false;

      if (player.y + playerRadius >= groundY && previousBottom <= groundY + 4) {
        player.y = groundY - playerRadius;
        player.vy = 0;
        player.onGround = true;
        squash = 0.78;
      }

      for (const platform of platforms) {
        const overlapsX = player.x + playerRadius > platform.x && player.x - playerRadius < platform.x + platform.width;
        const crossedTop = previousBottom <= platform.y && player.y + playerRadius >= platform.y;
        if (overlapsX && crossedTop && player.vy >= 0) {
          player.y = platform.y - playerRadius;
          player.vy = 0;
          player.onGround = true;
          squash = 0.78;
        }
      }

      squash += (1 - squash) * Math.min(1, 0.22 * step);
      ballRotation += (player.vx * step) / playerRadius;

      for (const spike of spikes) {
        const overlaps = player.x + playerRadius > spike.x && player.x - playerRadius < spike.x + spike.width;
        if (overlaps && player.y + playerRadius > groundY - 29) {
          loseLife();
          return;
        }
      }

      for (const hazard of movingHazards) {
        if (Math.hypot(player.x - hazard.x, player.y - hazard.y) < playerRadius + hazard.radius - 3) {
          loseLife();
          return;
        }
      }

      if (player.y > viewHeight + playerRadius) {
        loseLife();
        return;
      }

      for (const star of stars) {
        const starY = star.y + Math.sin(animationTime * 2.4 + star.phase) * 5;
        if (!star.collected && Math.hypot(player.x - star.x, player.y - starY) < playerRadius + 15) {
          star.collected = true;
          starsElement.textContent = `${stars.filter((item) => item.collected).length} / ${stars.length}`;
        }
      }

      if (player.x >= worldWidth - 75) winGame();
      const targetCameraX = Math.max(0, Math.min(worldWidth - viewWidth, player.x - viewWidth * 0.36));
      cameraX += (targetCameraX - cameraX) * Math.min(1, 0.12 * step);
    }

    function drawStar(x, y, radius) {
      ctx.beginPath();
      for (let i = 0; i < 10; i += 1) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const r = i % 2 === 0 ? radius : radius * 0.45;
        const px = x + Math.cos(angle) * r;
        const py = y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      if (!player || !stars) return;
      const palette = palettes[(levelIndex - 1) % palettes.length];
      const sky = ctx.createLinearGradient(0, 0, 0, viewHeight);
      sky.addColorStop(0, palette[0]);
      sky.addColorStop(1, palette[1]);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      ctx.fillStyle = "#c0e5cf";
      for (let i = 0; i < 8; i += 1) {
        const x = ((i * 170 - cameraX * 0.2 + animationTime * (8 + i % 3)) % (viewWidth + 220)) - 80;
        ctx.beginPath();
        ctx.arc(x, 370, 115 + (i % 3) * 18, Math.PI, 0);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(-cameraX, 0);
      ctx.fillStyle = palette[2];
      ctx.fillRect(0, groundY, worldWidth, viewHeight - groundY);
      ctx.fillStyle = "#73bd6b";
      ctx.fillRect(0, groundY, worldWidth, 12);

      for (const platform of platforms) {
        ctx.fillStyle = "#855a3d";
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
        ctx.fillStyle = "#79c96d";
        ctx.fillRect(platform.x, platform.y, platform.width, 7);
      }

      ctx.fillStyle = "#ed5260";
      for (const spike of spikes) {
        const count = Math.ceil(spike.width / 25);
        const width = spike.width / count;
        for (let i = 0; i < count; i += 1) {
          ctx.beginPath();
          ctx.moveTo(spike.x + i * width, groundY);
          ctx.lineTo(spike.x + i * width + width / 2, groundY - 30);
          ctx.lineTo(spike.x + (i + 1) * width, groundY);
          ctx.closePath();
          ctx.fill();
        }
      }

      for (const star of stars) {
        if (star.collected) continue;
        const bobY = star.y + Math.sin(animationTime * 2.4 + star.phase) * 5;
        ctx.fillStyle = "#ffd14f";
        ctx.shadowColor = "#ffca3a";
        ctx.shadowBlur = 14 + Math.sin(animationTime * 4 + star.phase) * 3;
        drawStar(star.x, bobY, 15 + Math.sin(animationTime * 3 + star.phase) * 1.5);
        ctx.shadowBlur = 0;
      }

      for (const hazard of movingHazards) {
        ctx.save();
        ctx.translate(hazard.x, hazard.y);
        ctx.rotate(animationTime * 2.4);
        ctx.shadowColor = "#742b47";
        ctx.shadowBlur = 12;
        ctx.fillStyle = "#c33559";
        ctx.beginPath();
        ctx.arc(0, 0, hazard.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffd3d8";
        ctx.lineWidth = 3;
        for (let i = 0; i < 8; i += 1) {
          ctx.rotate(Math.PI / 4);
          ctx.beginPath();
          ctx.moveTo(hazard.radius - 3, 0);
          ctx.lineTo(hazard.radius + 7, 0);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.fillStyle = "#f5f7ed";
      ctx.fillRect(worldWidth - 82, groundY - 135, 7, 135);
      ctx.fillStyle = "#ef5264";
      ctx.beginPath();
      ctx.moveTo(worldWidth - 75, groundY - 132);
      ctx.lineTo(worldWidth - 15, groundY - 112);
      ctx.lineTo(worldWidth - 75, groundY - 91);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#d93042";
      ctx.shadowColor = "#ad2434";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.ellipse(player.x, player.y, playerRadius / squash, playerRadius * squash, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(ballRotation);
      ctx.strokeStyle = "#f56a75";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, playerRadius * 0.72, -0.9, 0.9);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(player.x + 6, player.y - 6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#25364a";
      ctx.beginPath();
      ctx.arc(player.x + 7, player.y - 6, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function loop(timestamp) {
      if (state !== "playing") return;
      const elapsed = Math.min(50, timestamp - lastFrame);
      lastFrame = timestamp;
      accumulator += elapsed;
      while (accumulator >= 1000 / 60 && state === "playing") {
        update(1);
        accumulator -= 1000 / 60;
      }
      draw();
      if (state === "playing") requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(event.key)) event.preventDefault();
      if (!keys.has(event.key) && ["ArrowUp", "w", "W", " "].includes(event.key)) {
        jumpQueuedUntil = performance.now() + 150;
      }
      keys.add(event.key);
      if (state === "ready" && ["ArrowLeft", "ArrowRight", "ArrowUp", " ", "a", "A", "d", "D", "w", "W"].includes(event.key)) {
        startGame();
      }
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.key);
    });
    window.addEventListener("blur", () => keys.clear());
    window.addEventListener("resize", resizeCanvas);
    startButton.addEventListener("click", startGame);
    document.querySelector("#restart").addEventListener("click", () => {
      if (state === "playing") {
        loseLife();
        return;
      }
      state = "ready";
      resetLevel();
      showOverlay(`المرحلة ${levelIndex}`, "لديك 3 محاولات فقط. استخدم ← و → للحركة و↑ أو مسافة للقفز، واجمع النجوم وتجنب الأشواك والأعداء المتحركين!", "ابدأ المرحلة");
    });

    resetLevel();
    resizeCanvas();
  </script>
</body>
</html>
